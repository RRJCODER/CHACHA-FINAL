{% extends "layout.html" %}
{% block titulo %}Editar trabajador{% endblock %}

{% block contenido %}
<section class="panel narrow">
    <div class="panel-head">
        <h3>Editar trabajador</h3>
    </div>

    <form method="post" class="form-vertical">
        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ trabajador.nombre }}" required>

        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ trabajador.telefono }}">

        <label>Precio hora extra</label>
        <input type="number" step="0.01" name="precio_hora" value="{{ trabajador.precio_hora }}">
        <p class="help-text">Este importe solo se aplica a las horas que superen la jornada normal del día.</p>

        <button type="submit">Guardar cambios</button>
        <a class="cancel" href="{{ url_for('trabajadores') }}">Cancelar</a>
    </form>
</section>
{% endblock %}
